name: "Test downstream compatibility"

on:
  workflow_call:
    inputs:
      arc-validate-ref:
        description: "Exact arc-validate commit to test"
        type: string
        required: true

jobs:
  test-candidate-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout AVPR candidate
        uses: actions/checkout@v4

      - name: Checkout pinned arc-validate consumer
        uses: actions/checkout@v4
        with:
          repository: nfdi4plants/arc-validate
          ref: ${{ inputs.arc-validate-ref }}
          path: downstream/arc-validate

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Prepare build scripts
        run: |
          chmod +x build.sh
          chmod +x downstream/arc-validate/build.sh

      - name: Pack explicit AVPR candidates
        run: ./build.sh PackCandidatePackages

      - name: Test pinned downstream consumer
        working-directory: downstream/arc-validate
        env:
          AVPR_CANDIDATE_PACKAGE_DIR: ${{ github.workspace }}/artifacts/packages
          AVPR_CANDIDATE_COMMIT: ${{ github.sha }}
          ARC_VALIDATE_COMMIT: ${{ inputs.arc-validate-ref }}
        run: ./build.sh TestAVPRCandidate
