name: "pipeline"

on:
  push:
    branches: ['main', 'dev']

  workflow_dispatch:
    inputs:
      dry-run:
        description: 'dry run mode'
        required: true
        default: true
        type: boolean

  pull_request:
    branches: ['main', 'dev']

jobs:   
  setup:
    runs-on: ubuntu-latest
    outputs: 

      # changed files output, might be relevant for other jobs
      global_any_modified: ${{ steps.changed-files-yaml.outputs.global_any_modified }}
      global_all_modified_files: ${{ steps.changed-files-yaml.outputs.global_all_modified_files }}

      staging_area_all_modified_files: ${{ steps.changed-files-yaml.outputs.packages_all_modified_files }}
      staging_area_any_modified: ${{ steps.changed-files-yaml.outputs.packages_any_modified }}

      tests_all_modified_files: ${{ steps.changed-files-yaml.outputs.tests_all_modified_files }}
      tests_any_modified: ${{ steps.changed-files-yaml.outputs.tests_any_modified }}

      api_all_modified_files: ${{ steps.changed-files-yaml.outputs.api_all_modified_files }}
      api_any_modified: ${{ steps.changed-files-yaml.outputs.api_any_modified }}

      client_all_modified_files: ${{ steps.changed-files-yaml.outputs.client_all_modified_files }}
      client_any_modified: ${{ steps.changed-files-yaml.outputs.client_any_modified }}

      index_all_modified_files: ${{ steps.changed-files-yaml.outputs.index_all_modified_files }}
      index_any_modified: ${{ steps.changed-files-yaml.outputs.index_any_modified }}

      model_all_modified_files: ${{ steps.changed-files-yaml.outputs.model_all_modified_files }}
      model_any_modified: ${{ steps.changed-files-yaml.outputs.model_any_modified }}

      codecs_all_modified_files: ${{ steps.changed-files-yaml.outputs.codecs_all_modified_files }}
      codecs_any_modified: ${{ steps.changed-files-yaml.outputs.codecs_any_modified }}

      # dry run so we can do manual diagnostics
      is_dry_run: ${{ steps.decide-on-dry-run.outputs.dry_run }}

      # trigger other jobs
      trigger-build-and-test-projects: ${{steps.set-triggers.outputs.trigger-build-and-test-projects}}
      trigger-release-index: ${{steps.set-triggers.outputs.trigger-release-index}}
      trigger-release-client: ${{steps.set-triggers.outputs.trigger-release-client}}
      trigger-release-api: ${{steps.set-triggers.outputs.trigger-release-api}}
      trigger-release-model: ${{steps.set-triggers.outputs.trigger-release-model}}
      trigger-release-codecs: ${{steps.set-triggers.outputs.trigger-release-codecs}}

      trigger-test-staging-area: ${{steps.set-triggers.outputs.trigger-test-staging-area}}
      trigger-test-portable-model: ${{steps.set-triggers.outputs.trigger-test-portable-model}}
      trigger-test-portable-codecs: ${{steps.set-triggers.outputs.trigger-test-portable-codecs}}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OR "2" -> To retrieve the preceding commit.
      - name: Get all relevant file changes
        id: changed-files-yaml
        uses: tj-actions/changed-files@531f5f7d163941f0c1c04e0ff4d8bb243ac4366f
        with:
          since_last_remote_commit: true
          files_yaml: |
            global:
              - '**'
            packages:
              - StagingArea/**
            tests:
              - tests/**
            api:
              - src/PackageRegistryService/**
            client:
              - src/AVPRClient/**
            index:
              - src/AVPRIndex/**
              - src/AVPR.Staging/**
              - src/AVPRCI/**
              - tests/AVPR.Staging.Tests/**
              - tests/AVPRCI.Tests/**
            model:
              - src/ValidationPackage.Model/**
              - tests/ValidationPackage.Model.Tests/**
              - tests/ValidationPackage.Model.PackageSmoke/**
              - .config/dotnet-tools.json
              - package.json
              - pyproject.toml
              - uv.lock
            codecs:
              - src/ValidationPackage.Model/**
              - src/ValidationPackage.Codecs/**
              - tests/ValidationPackage.Codecs.Tests/**
              - tests/ValidationPackage.Codecs.PackageSmoke/**
              - .config/dotnet-tools.json
              - package.json
              - pyproject.toml
              - uv.lock

      - name: decide on dry run
        id: decide-on-dry-run
        run: |
          if [[ ${{ github.event_name == 'workflow_dispatch' }} == true ]]; then
            dr=${{ inputs.dry-run }}
          else
            dr=false
          fi
          echo "dry_run=$dr" >> $GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT"
          echo "dry_run=$dr"

      - name: set triggers
        id: set-triggers
        run: |
          echo "trigger-build-and-test-projects=${{ steps.changed-files-yaml.outputs.tests_any_modified == 'true' || steps.changed-files-yaml.outputs.api_any_modified == 'true' || steps.changed-files-yaml.outputs.client_any_modified == 'true' || steps.changed-files-yaml.outputs.index_any_modified == 'true' || steps.changed-files-yaml.outputs.model_any_modified == 'true' || steps.changed-files-yaml.outputs.codecs_any_modified == 'true'}}" >> $GITHUB_OUTPUT
          echo "trigger-release-index=${{github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.decide-on-dry-run.outputs.dry_run == 'false' && contains(steps.changed-files-yaml.outputs.index_all_modified_files, 'src/AVPRIndex/RELEASE_NOTES.md')}}" >> $GITHUB_OUTPUT
          echo "trigger-release-client=${{github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.decide-on-dry-run.outputs.dry_run == 'false' && contains(steps.changed-files-yaml.outputs.client_all_modified_files, 'RELEASE_NOTES.md')}}" >> $GITHUB_OUTPUT
          echo "trigger-release-model=${{github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.decide-on-dry-run.outputs.dry_run == 'false' && contains(steps.changed-files-yaml.outputs.model_all_modified_files, 'RELEASE_NOTES.md')}}" >> $GITHUB_OUTPUT
          echo "trigger-release-codecs=${{github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.decide-on-dry-run.outputs.dry_run == 'false' && contains(steps.changed-files-yaml.outputs.codecs_all_modified_files, 'src/ValidationPackage.Codecs/RELEASE_NOTES.md')}}" >> $GITHUB_OUTPUT
          echo "trigger-test-staging-area=${{steps.changed-files-yaml.outputs.packages_any_modified == 'true' && steps.decide-on-dry-run.outputs.dry_run == 'false'}}" >> $GITHUB_OUTPUT
          echo "trigger-test-portable-model=${{steps.changed-files-yaml.outputs.model_any_modified == 'true'}}" >> $GITHUB_OUTPUT
          echo "trigger-test-portable-codecs=${{steps.changed-files-yaml.outputs.codecs_any_modified == 'true'}}" >> $GITHUB_OUTPUT
          echo "trigger-release-api=${{github.event_name == 'push' && steps.decide-on-dry-run.outputs.dry_run == 'false' && steps.changed-files-yaml.outputs.api_any_modified == 'true' }}" >> $GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT"

      - name: list outputs
        run: |
          echo "global:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.global_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.global_all_modified_files }}"
          echo "staging area:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.packages_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.packages_all_modified_files }}"
          echo "tests:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.tests_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.tests_all_modified_files }}"
          echo "api:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.api_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.api_all_modified_files }}"
          echo "client:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.client_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.client_all_modified_files }}"
          echo "index:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.index_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.index_all_modified_files }}"
          echo "portable model:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.model_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.model_all_modified_files }}"
          echo "portable codecs:"
          echo "- any: ${{ steps.changed-files-yaml.outputs.codecs_any_modified }}"
          echo "- all: ${{ steps.changed-files-yaml.outputs.codecs_all_modified_files }}"
          echo "computed outputs:"
          echo "dry run: ${{ steps.decide-on-dry-run.outputs.dry_run }}"
          echo "trigger build-and-test-projects: ${{steps.set-triggers.outputs.trigger-build-and-test-projects}}"
          echo "trigger release-index: ${{steps.set-triggers.outputs.trigger-release-index}}"
          echo "trigger release-client: ${{steps.set-triggers.outputs.trigger-release-client}}"
          echo "trigger release-model: ${{steps.set-triggers.outputs.trigger-release-model}}"
          echo "trigger release-codecs: ${{steps.set-triggers.outputs.trigger-release-codecs}}"
          echo "trigger release-api: ${{steps.set-triggers.outputs.trigger-release-api}}"
          echo "trigger test-staging-area: ${{steps.set-triggers.outputs.trigger-test-staging-area}}"
          echo "trigger test-portable-model: ${{steps.set-triggers.outputs.trigger-test-portable-model}}"
          echo "trigger test-portable-codecs: ${{steps.set-triggers.outputs.trigger-test-portable-codecs}}"

      - name: list triggered jobs
        run: |
          echo "this should trigger the following jobs:"
          echo "build-and-test-projects: ${{steps.set-triggers.outputs.trigger-build-and-test-projects}}"
          echo "release-index: ${{steps.set-triggers.outputs.trigger-release-index}}"
          echo "release-client: ${{steps.set-triggers.outputs.trigger-release-client}}"
          echo "release-model: ${{steps.set-triggers.outputs.trigger-release-model}}"
          echo "release-codecs: ${{steps.set-triggers.outputs.trigger-release-codecs}}"
          echo "release-api: ${{steps.set-triggers.outputs.trigger-release-api}}"
          echo "test-staging-area: ${{steps.set-triggers.outputs.trigger-test-staging-area}}"
          echo "test-portable-model: ${{steps.set-triggers.outputs.trigger-test-portable-model}}"
          echo "test-portable-codecs: ${{steps.set-triggers.outputs.trigger-test-portable-codecs}}"

  build-and-test-projects:
    name: "Build and test projects"
    needs: setup
    # https://github.com/actions/runner/issues/1173
    if: needs.setup.outputs.trigger-build-and-test-projects == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/build-and-test-solution.yml@main
    with:
      solution: ./arc-validate-package-registry.sln
      configuration: Release

  release-index-package:
    name: "Release index package"
    needs: [setup, build-and-test-projects]
    if: needs.setup.outputs.trigger-release-index == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/release-package.yml@main
    with:
      project: src/AVPRIndex/AVPRIndex.fsproj
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}

  release-client-package:
    name: "Release client package"
    needs: [setup, build-and-test-projects]
    if: needs.setup.outputs.trigger-release-client == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/release-package.yml@main
    with:
      project: src/AVPRClient/AVPRClient.csproj
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}

  release-model-package:
    name: "Release portable model package"
    needs: [setup, build-and-test-projects, test-portable-model]
    if: needs.setup.outputs.trigger-release-model == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/release-package.yml@main
    with:
      project: src/ValidationPackage.Model/ValidationPackage.Model.fsproj
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}

  release-codecs-package:
    name: "Release portable codecs package"
    needs: [setup, build-and-test-projects, test-portable-codecs]
    if: needs.setup.outputs.trigger-release-codecs == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/release-package.yml@main
    with:
      project: src/ValidationPackage.Codecs/ValidationPackage.Codecs.fsproj
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}

  release-api-image:
    name: "Release API image"
    needs: [setup, build-and-test-projects]
    if: needs.setup.outputs.trigger-release-api == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: nfdi4plants/avpr
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5.1.0
        with:
          context: .
          file: ./src/PackageRegistryService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AVPR_BUILD_REVISION=${{ github.sha }}
            AVPR_BUILD_CHANNEL=${{ github.ref_name }}
            AVPR_BUILD_CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  test-staging-area:
    name: "Test staging area"
    needs: setup
    # https://github.com/actions/runner/issues/1173
    if: needs.setup.outputs.trigger-test-staging-area == 'true'
    uses: nfdi4plants/arc-validate-package-registry/.github/workflows/build-and-test-solution.yml@main
    with:
      solution: ./PackageStagingArea.sln
      configuration: Release
      install-uv: true
      windows: true
      ubuntu: false
      macos: false

  test-portable-model:
    name: "Test portable model"
    needs: setup
    if: needs.setup.outputs.trigger-test-portable-model == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Restore tools and Python environment
        run: |
          dotnet tool restore
          uv sync --locked
      - name: Test model on .NET
        run: dotnet run --project tests/ValidationPackage.Model.Tests/ValidationPackage.Model.Tests.fsproj --configuration Release
      - name: Test model on JavaScript
        run: |
          dotnet fable tests/ValidationPackage.Model.Tests/ValidationPackage.Model.Tests.fsproj --outDir artifacts/model-tests/js --lang javascript --noCache
          npm run test:model:js
      - name: Test model on Python
        run: |
          dotnet fable tests/ValidationPackage.Model.Tests/ValidationPackage.Model.Tests.fsproj --outDir artifacts/model-tests/py --lang python --noCache
          uv run --locked python artifacts/model-tests/py/main.py
      - name: Pack model
        run: dotnet pack src/ValidationPackage.Model/ValidationPackage.Model.fsproj --configuration Release --output artifacts/packages
      - name: Verify Fable package sources
        run: |
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/ValidationPackage.Model.fsproj'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/PortableHash.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/SemanticVersion.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/ValidationPackageIdentity.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/Cwl.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/Author.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/OntologyAnnotation.fs'
          unzip -l artifacts/packages/ValidationPackage.Model.*.nupkg | grep 'fable/ValidationPackageMetadata.fs'
      - name: Test packed-package consumption
        run: |
          dotnet restore tests/ValidationPackage.Model.PackageSmoke/ValidationPackage.Model.PackageSmoke.fsproj --source "$GITHUB_WORKSPACE/artifacts/packages" --source https://api.nuget.org/v3/index.json
          dotnet run --project tests/ValidationPackage.Model.PackageSmoke/ValidationPackage.Model.PackageSmoke.fsproj --configuration Release --no-restore

  test-portable-codecs:
    name: "Test portable codecs"
    needs: setup
    if: needs.setup.outputs.trigger-test-portable-codecs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x.x
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Restore tools and Python environment
        run: |
          dotnet tool restore
          uv sync --locked
      - name: Test codecs on .NET
        run: dotnet run --project tests/ValidationPackage.Codecs.Tests/ValidationPackage.Codecs.Tests.fsproj --configuration Release
      - name: Test codecs on JavaScript
        run: |
          dotnet fable tests/ValidationPackage.Codecs.Tests/javascript/ValidationPackage.Codecs.Tests.Javascript.fsproj --outDir artifacts/codec-tests-js/out --lang javascript --noCache
          npm run test:codecs:js
      - name: Test codecs on Python
        run: |
          dotnet fable tests/ValidationPackage.Codecs.Tests/python/ValidationPackage.Codecs.Tests.Python.fsproj --outDir artifacts/codec-tests-python/out --lang python --noCache
          uv run --locked python -c "import runpy,sys; sys.path[:0] = ['artifacts/codec-tests-python/out', 'artifacts/codec-tests-python/out/__']; runpy.run_path('artifacts/codec-tests-python/out/__/main.py', run_name='__main__')"
      - name: Pack model and codecs
        run: |
          dotnet pack src/ValidationPackage.Model/ValidationPackage.Model.fsproj --configuration Release --output artifacts/packages
          dotnet pack src/ValidationPackage.Codecs/ValidationPackage.Codecs.fsproj --configuration Release --output artifacts/packages
      - name: Verify Fable codec package sources
        run: |
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/ValidationPackage.Codecs.fsproj'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/FrontmatterLanguage.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/Frontmatter.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/YamlValue.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/CwlYaml.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/AuthorYaml.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/OntologyAnnotationYaml.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/ValidationPackageYaml.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/JsonRuntime.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/CwlJson.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/AuthorJson.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/OntologyAnnotationJson.fs'
          unzip -l artifacts/packages/ValidationPackage.Codecs.*.nupkg | grep 'fable/ValidationPackageJson.fs'
      - name: Restore packed-package smoke project
        run: dotnet restore tests/ValidationPackage.Codecs.PackageSmoke/ValidationPackage.Codecs.PackageSmoke.fsproj --source "$GITHUB_WORKSPACE/artifacts/packages" --source https://api.nuget.org/v3/index.json
      - name: Test packed codecs on .NET
        run: dotnet run --project tests/ValidationPackage.Codecs.PackageSmoke/ValidationPackage.Codecs.PackageSmoke.fsproj --configuration Release --no-restore
      - name: Test packed codecs on JavaScript
        run: |
          dotnet fable tests/ValidationPackage.Codecs.PackageSmoke/ValidationPackage.Codecs.PackageSmoke.fsproj --outDir artifacts/codec-package-smoke-js --lang javascript --noCache
          node artifacts/codec-package-smoke-js/Program.js
      - name: Test packed codecs on Python
        run: |
          dotnet fable tests/ValidationPackage.Codecs.PackageSmoke/ValidationPackage.Codecs.PackageSmoke.fsproj --outDir artifacts/codec-package-smoke-py --lang python --noCache
          uv run --locked python artifacts/codec-package-smoke-py/program.py
