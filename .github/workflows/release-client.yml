name: "Release AVPRClient"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-avprclient
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify AVPRClient release"
    uses: ./.github/workflows/verify-release.yml

  publish:
    name: "Publish AVPRClient to NuGet"
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-package.yml
    with:
      target: PackClient
