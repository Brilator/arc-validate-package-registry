name: "Release AVPRClient.Interop"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "Verify AVPRClient.Interop release"
    uses: ./.github/workflows/verify-release.yml

  publish:
    name: "Publish AVPRClient.Interop to NuGet"
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-package.yml
    with:
      target: PackClientInterop
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
